[package]
name = "wallet-tracker"
version = "0.1.0"
edition = "2021"
description = "High-performance smart wallet transaction tracking service for SoloAlpha Bot"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"