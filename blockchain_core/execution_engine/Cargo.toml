[package]
name = "execution-engine"
version = "0.1.0"
edition = "2021"
description = "Same-block execution engine for SoloAlpha Bot - EVM (Flashbots) and Solana (Jito)"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
sha2 = "0.10"
anyhow = "1"
thiserror = "1"

# EVM dependencies
ethers-core = { version = "2", optional = true }
ethers-providers = { version = "2", optional = true }
ethers-middleware = { version = "2", optional = true }

[features]
default = ["evm", "solana"]
evm = ["ethers-core", "ethers-providers", "ethers-middleware"]
solana = []